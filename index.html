<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parts finder</title>
  <meta name="description" content="Find which cabinet drawer holds a component.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Parts finder">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2b3036">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="shop" class="visually-hidden">Parts finder</h1>
    <nav class="views" aria-label="Pages">
      <button type="button" class="view-tab" data-view="parts" aria-pressed="true" aria-label="Parts finder">Parts</button>
      <button type="button" class="view-tab" data-view="res" aria-pressed="false" aria-label="Resistors: color code">Resistors</button>
      <button type="button" class="view-tab" data-view="look" aria-pressed="false" aria-label="Lookup: search any item online">Lookup</button>
    </nav>
    <div id="parts-bar">
      <label class="visually-hidden" for="q">Part number</label>
      <input id="q" class="field" type="search" placeholder="Part number, e.g. AN5835"
             autocapitalize="characters" autocorrect="off" autocomplete="off"
             spellcheck="false" enterkeyhint="search">
    </div>
    <div id="res-bar" class="res-bar" hidden>
      <label class="visually-hidden" for="rv">Resistance value</label>
      <input id="rv" class="field" type="text" inputmode="decimal" placeholder="Value, e.g. 4.7"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <div class="units" role="group" aria-label="Unit">
        <button type="button" class="unit" data-mult="1" aria-pressed="false" aria-label="Ohms">Ω</button>
        <button type="button" class="unit" data-mult="1000" aria-pressed="true" aria-label="Kilohms">kΩ</button>
        <button type="button" class="unit" data-mult="1000000" aria-pressed="false" aria-label="Megohms">MΩ</button>
      </div>
    </div>
    <form id="look-bar" class="look-bar" role="search" hidden>
      <label class="visually-hidden" for="lq">Item to look up</label>
      <input id="lq" class="field" type="search" placeholder="Any item, e.g. LM386"
             autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button class="go" type="submit" aria-label="Search online">Search</button>
    </form>
  </header>

  <main id="parts">
    <p id="status" class="status" aria-live="polite">Loading parts…</p>
    <ul id="results" class="results"></ul>
    <p id="more" class="hint" hidden>Type more of the number to narrow it down.</p>

    <nav id="switcher" class="switcher" aria-label="Cabinets" hidden></nav>
    <section id="cabinet" class="cabinet" aria-label="Cabinet"></section>
  </main>

  <main id="res" hidden>
    <p id="r-status" class="status" aria-live="polite"></p>
    <div id="r-cards"></div>
  </main>

  <main id="look" hidden>
    <p id="l-status" class="status" aria-live="polite">Type any item (a part number, a component, a tool), then tap Search. Needs internet.</p>
    <div id="l-links" class="links" hidden></div>
    <div id="l-wiki"></div>
    <h2 id="l-pics-h" class="l-head" hidden>Pictures</h2>
    <div id="l-pics" class="pics"></div>
  </main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-body">
      <p id="sheet-cab" class="sheet-cab" hidden></p>
      <h2 id="sheet-title"></h2>
      <p id="sheet-sub" class="sheet-sub"></p>
      <ul id="sheet-parts" class="sheet-parts"></ul>
      <p id="sheet-note" class="sheet-note" hidden></p>
      <div id="sheet-map" class="minimap" aria-hidden="true"></div>
      <button id="done" class="done" type="button" aria-label="Done, close drawer">Done</button>
    </div>
  </dialog>

  <script src="app.js"></script>
  <script src="resistor.js"></script>
  <script src="lookup.js"></script>
</body>
</html>
